<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ServiceTile — Master APP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Unbounded:wght@700;800&amp;display=swap">
<style>
.t-light{--bg:#f6f5f4;--surface:#ffffff;--surface-2:#efedeb;--border:#e4e2df;--border-strong:#8c8c94;--ink:#18181b;--ink-2:#52525b;--ink-3:#66666e;--action:#18181b;--on-action:#ffffff;--brand:#dc2626;--brand-press:#b91c1c;--on-brand:#ffffff;--brand-text:#b91c1c;--brand-tint:#fee2e2;--success:#15803d;--success-tint:#dcfce7;--warning:#b45309;--warning-tint:#fef3c7;--trust:#1d4ed8;--trust-tint:#dbeafe;--star:#d97706;--scrim:rgba(24, 24, 27, 0.48);--map-bg:#e9e6e1;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-12:48px;--radius-sm:6px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-full:999px;--size-tap:48px;--size-control:52px;--size-icon-sm:16px;--size-icon:24px;--size-avatar:56px;--size-sos:64px;--size-tabbar:64px;--shadow-card:0 1px 2px rgba(24, 24, 27, 0.06), 0 1px 3px rgba(24, 24, 27, 0.08);--shadow-float:0 8px 24px rgba(24, 24, 27, 0.16);--shadow-sheet:0 -4px 24px rgba(24, 24, 27, 0.12);--font-display:"Unbounded","Inter",system-ui,sans-serif;--font-sans:"Inter",system-ui,-apple-system,Roboto,sans-serif}
.t-dark{--bg:#0f0f11;--surface:#18181b;--surface-2:#232327;--border:#2e2e33;--border-strong:#6b6b75;--ink:#fafafa;--ink-2:#a1a1aa;--ink-3:#8b8b94;--action:#fafafa;--on-action:#18181b;--brand:#dc2626;--brand-press:#b91c1c;--on-brand:#ffffff;--brand-text:#f87171;--brand-tint:#3b1414;--success:#4ade80;--success-tint:#0f2a1a;--warning:#fbbf24;--warning-tint:#2e2410;--trust:#60a5fa;--trust-tint:#13213d;--star:#fbbf24;--scrim:rgba(0, 0, 0, 0.64);--map-bg:#1f1f23;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-12:48px;--radius-sm:6px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-full:999px;--size-tap:48px;--size-control:52px;--size-icon-sm:16px;--size-icon:24px;--size-avatar:56px;--size-sos:64px;--size-tabbar:64px;--shadow-card:none;--shadow-float:0 8px 24px rgba(0, 0, 0, 0.5);--shadow-sheet:0 -4px 24px rgba(0, 0, 0, 0.5);--font-display:"Unbounded","Inter",system-ui,sans-serif;--font-sans:"Inter",system-ui,-apple-system,Roboto,sans-serif}
body{margin:0;font-family:"Inter",system-ui,sans-serif}
.pair{display:grid;grid-template-columns:440px 440px}
.pair>section{background:var(--bg)}
.cap{font:600 12px/16px "Inter",sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:12px 20px 0;color:var(--ink-2)}
/* Master APP — веб-референс компонентов. Все значения — из tokens.css (var(--…)).
   В React Native те же токены идут в theme.ts; эти классы — эталон вида и состояний. */

.ma, .ma * { box-sizing: border-box; }
.ma { font-family: var(--font-sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
.ma-stack { display: flex; flex-direction: column; gap: var(--space-3); }
.ma-row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.ma-ico { width: var(--size-icon); height: var(--size-icon); flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ma-ico-sm { width: var(--size-icon-sm); height: var(--size-icon-sm); }
.ma-meta { font-size: 14px; line-height: 20px; color: var(--ink-2); }

/* ---------- Button ---------- */
.ma-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: var(--size-control); padding: 0 var(--space-5); border-radius: var(--radius-md);
  border: 0; font: 600 15px/20px var(--font-sans); cursor: pointer; transition: background-color .15s ease, opacity .15s ease; }
.ma-btn--block { width: 100%; }
.ma-btn--primary { background: var(--action); color: var(--on-action); }
.ma-btn--brand { background: var(--brand); color: var(--on-brand); }
.ma-btn--brand:active, .ma-btn--brand.is-pressed { background: var(--brand-press); }
.ma-btn--secondary { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--border-strong); }
.ma-btn--ghost { background: transparent; color: var(--ink); }
.ma-btn--danger { background: transparent; color: var(--brand-text); }
.ma-btn--sm { min-height: 40px; padding: 0 var(--space-4); font-size: 14px; border-radius: 10px; }
.ma-btn[disabled], .ma-btn.is-disabled { background: var(--surface-2); color: var(--ink-3); box-shadow: none; cursor: not-allowed; }
.ma-btn:focus-visible { outline: 3px solid var(--trust); outline-offset: 2px; }
.ma-spinner { width: 18px; height: 18px; border-radius: var(--radius-full); border: 2px solid currentColor; border-right-color: transparent; }

/* ---------- SOS ---------- */
.ma-sos { width: var(--size-sos); height: var(--size-sos); border-radius: var(--radius-full); border: 0;
  background: var(--brand); color: var(--on-brand); box-shadow: var(--shadow-float);
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font: 800 12px/14px var(--font-display); letter-spacing: .04em; }
.ma-sos-bar { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-lg); background: var(--brand); color: var(--on-brand); min-height: 64px; }
.ma-sos-bar b { font: 700 16px/22px var(--font-sans); display: block; }
.ma-sos-bar span { font-size: 13px; line-height: 18px; opacity: .92; }

/* ---------- Service tile / chip ---------- */
.ma-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); }
.ma-tile { background: var(--surface); border-radius: var(--radius-md); padding: var(--space-3) var(--space-2);
  display: flex; flex-direction: column; align-items: center; gap: var(--space-2); text-align: center;
  font: 500 12px/16px var(--font-sans); color: var(--ink); min-height: 88px; box-shadow: var(--shadow-card); border: 1px solid var(--border); }
.ma-tile .ma-tile-ico { width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--surface-2); display: grid; place-items: center; }
.ma-tile.is-active { box-shadow: inset 0 0 0 2px var(--ink); }
.ma-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 var(--space-3);
  border-radius: var(--radius-full); background: var(--surface); border: 1px solid var(--border); font: 600 14px/20px var(--font-sans); color: var(--ink); white-space: nowrap; flex: none; }
.ma-chip.is-active { background: var(--action); color: var(--on-action); border-color: var(--action); }

/* ---------- Badge ---------- */
.ma-badge { display: inline-flex; align-items: center; gap: var(--space-1); height: 24px; padding: 0 8px;
  border-radius: var(--radius-sm); font: 600 12px/16px var(--font-sans); white-space: nowrap; }
.ma-badge--trust { background: var(--trust-tint); color: var(--trust); }
.ma-badge--success { background: var(--success-tint); color: var(--success); }
.ma-badge--warning { background: var(--warning-tint); color: var(--warning); }
.ma-badge--danger { background: var(--brand-tint); color: var(--brand-text); }
.ma-badge--neutral { background: var(--surface-2); color: var(--ink-2); }
.ma-dot { width: 8px; height: 8px; border-radius: var(--radius-full); background: currentColor; }

/* ---------- Rating ---------- */
.ma-rating { display: inline-flex; align-items: center; gap: 4px; font: 700 14px/20px var(--font-sans); color: var(--ink); }
.ma-rating svg { width: 16px; height: 16px; fill: var(--star); stroke: none; }
.ma-rating small { font-weight: 400; color: var(--ink-2); font-size: 14px; }
.ma-stars { display: inline-flex; gap: 2px; }
.ma-stars svg { width: 20px; height: 20px; fill: var(--star); }
.ma-stars svg.off { fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1; }

/* ---------- Master card ---------- */
.ma-card { background: var(--surface); border-radius: var(--radius-lg); padding: var(--space-4);
  box-shadow: var(--shadow-card); border: 1px solid var(--border); }
.ma-master { display: grid; grid-template-columns: var(--size-avatar) 1fr; gap: var(--space-3); }
.ma-avatar { width: var(--size-avatar); height: var(--size-avatar); border-radius: var(--radius-full); background: var(--surface-2);
  display: grid; place-items: center; font: 700 18px/1 var(--font-display); color: var(--ink); position: relative; }
.ma-avatar .ma-online { position: absolute; right: 1px; bottom: 1px; width: 14px; height: 14px; border-radius: var(--radius-full);
  background: var(--success); border: 2px solid var(--surface); }
.ma-master-name { font: 600 16px/22px var(--font-sans); display: flex; align-items: center; gap: 6px; }
.ma-master-name svg { width: 18px; height: 18px; color: var(--trust); }
.ma-master-foot { display: flex; align-items: center; justify-content: space-between; margin-top: var(--space-3);
  padding-top: var(--space-3); border-top: 1px solid var(--border); }
.ma-price { font: 700 20px/24px var(--font-display); }
.ma-price small { font: 400 13px/18px var(--font-sans); color: var(--ink-2); margin-right: 4px; }

/* ---------- Text field ---------- */
.ma-field { display: flex; flex-direction: column; gap: 6px; }
.ma-field label { font: 600 14px/20px var(--font-sans); }
.ma-input { min-height: var(--size-control); border-radius: var(--radius-md); background: var(--surface);
  border: 1.5px solid var(--border-strong); padding: 0 var(--space-4); display: flex; align-items: center; gap: var(--space-2);
  font: 400 16px/24px var(--font-sans); color: var(--ink); }
.ma-input .ph { color: var(--ink-3); }
.ma-input.is-focus { border-color: var(--ink); box-shadow: 0 0 0 3px var(--surface-2); }
.ma-input.is-error { border-color: var(--brand-text); }
.ma-help { font: 400 13px/18px var(--font-sans); color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
.ma-help.is-error { color: var(--brand-text); }

/* ---------- Order tracker ---------- */
.ma-track { display: flex; flex-direction: column; }
.ma-step { display: grid; grid-template-columns: 28px 1fr; gap: var(--space-3); min-height: 52px; position: relative; }
.ma-step::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--border); }
.ma-step:last-child::before { display: none; }
.ma-step.is-done::before { background: var(--ink); }
.ma-step-dot { width: 28px; height: 28px; border-radius: var(--radius-full); display: grid; place-items: center;
  background: var(--surface-2); color: var(--ink-3); border: 2px solid var(--border); position: relative; z-index: 1; }
.ma-step.is-done .ma-step-dot { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.ma-step.is-current .ma-step-dot { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.ma-step b { font: 600 15px/20px var(--font-sans); display: block; }
.ma-step span { font: 400 13px/18px var(--font-sans); color: var(--ink-2); }
.ma-step.is-todo b { color: var(--ink-3); font-weight: 500; }

/* ---------- Price breakdown ---------- */
.ma-price-box { background: var(--surface-2); border-radius: var(--radius-md); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
.ma-price-line { display: flex; justify-content: space-between; gap: var(--space-3); font: 400 15px/22px var(--font-sans); }
.ma-price-line span:last-child { font-variant-numeric: tabular-nums; }
.ma-price-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: var(--space-2); border-top: 1px dashed var(--border-strong); }
.ma-price-total b { font: 600 16px/22px var(--font-sans); }
.ma-price-note { display: flex; gap: 6px; align-items: flex-start; font: 400 13px/18px var(--font-sans); color: var(--success); }

/* ---------- Bottom nav ---------- */
.ma-tabbar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; height: var(--size-tabbar); background: var(--surface); border-top: 1px solid var(--border); }
.ma-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 500 12px/16px var(--font-sans); color: var(--ink-3); position: relative; text-decoration: none; }
.ma-tab.is-active { color: var(--ink); font-weight: 700; }
.ma-tab.is-active::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--brand); }
.ma-tab .ma-count { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--radius-full);
  background: var(--brand); color: var(--on-brand); font: 700 11px/18px var(--font-sans); text-align: center; }

/* ---------- Bottom sheet ---------- */
.ma-sheet { background: var(--surface); border-radius: var(--radius-xl) var(--radius-xl) 0 0; box-shadow: var(--shadow-sheet); padding: var(--space-2) var(--space-4) var(--space-5); }
.ma-grabber { width: 40px; height: 5px; border-radius: var(--radius-full); background: var(--border-strong); margin: 0 auto var(--space-3); opacity: .6; }
.ma-sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-3); }

/* ---------- Chat ---------- */
.ma-chat { display: flex; flex-direction: column; gap: var(--space-2); }
.ma-bubble { max-width: 78%; padding: 10px 14px; font: 400 15px/21px var(--font-sans); border-radius: 18px; }
.ma-bubble time { display: block; font-size: 11px; line-height: 14px; margin-top: 4px; opacity: .72; text-align: right; }
.ma-bubble--in { background: var(--surface-2); color: var(--ink); border-bottom-left-radius: 6px; align-self: flex-start; }
.ma-bubble--out { background: var(--action); color: var(--on-action); border-bottom-right-radius: 6px; align-self: flex-end; }
.ma-bubble--system { align-self: center; background: transparent; color: var(--ink-2); font-size: 13px; text-align: center; max-width: 90%; }
.ma-offer { align-self: flex-start; width: 78%; background: var(--surface); border: 1.5px solid var(--ink); border-radius: var(--radius-lg); padding: var(--space-3); }

/* ---------- Review ---------- */
.ma-review-head { display: flex; justify-content: space-between; align-items: center; }
.ma-review p { margin: var(--space-2) 0 0; font: 400 15px/22px var(--font-sans); }

/* ---------- Inspection item ---------- */
.ma-check { display: grid; grid-template-columns: 32px 1fr auto; gap: var(--space-3); align-items: center; padding: var(--space-3) 0; border-bottom: 1px solid var(--border); }
.ma-check:last-child { border-bottom: 0; }
.ma-check-ico { width: 32px; height: 32px; border-radius: var(--radius-full); display: grid; place-items: center; }
.ma-check.ok .ma-check-ico { background: var(--success-tint); color: var(--success); }
.ma-check.warn .ma-check-ico { background: var(--warning-tint); color: var(--warning); }
.ma-check.bad .ma-check-ico { background: var(--brand-tint); color: var(--brand-text); }
.ma-check b { font: 600 15px/20px var(--font-sans); display: block; }
.ma-check span { font: 400 13px/18px var(--font-sans); color: var(--ink-2); }
.ma-thumb { width: 44px; height: 44px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-2); }

/* ---------- Empty state ---------- */
.ma-empty { text-align: center; padding: var(--space-8) var(--space-6); display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }
.ma-empty-ico { width: 72px; height: 72px; border-radius: var(--radius-full); background: var(--surface-2); display: grid; place-items: center; color: var(--ink-2); }
.ma-empty h3 { margin: 0; font: 700 18px/24px var(--font-sans); }
.ma-empty p { margin: 0; font: 400 15px/22px var(--font-sans); color: var(--ink-2); max-width: 280px; }

/* ---------- Banner ---------- */
.ma-banner { display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); font: 400 14px/20px var(--font-sans); }
.ma-banner b { font-weight: 600; display: block; }
.ma-banner--info { background: var(--trust-tint); color: var(--ink); } .ma-banner--info .ma-ico { color: var(--trust); }
.ma-banner--success { background: var(--success-tint); color: var(--ink); } .ma-banner--success .ma-ico { color: var(--success); }
.ma-banner--warning { background: var(--warning-tint); color: var(--ink); } .ma-banner--warning .ma-ico { color: var(--warning); }
.ma-banner--danger { background: var(--brand-tint); color: var(--ink); } .ma-banner--danger .ma-ico { color: var(--brand-text); }

/* ---------- Map pin ---------- */
.ma-map { background: var(--map-bg); border-radius: var(--radius-lg); position: relative; overflow: hidden; }
.ma-pin { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px 0 4px; border-radius: var(--radius-full);
  background: var(--surface); color: var(--ink); font: 700 13px/1 var(--font-sans); box-shadow: var(--shadow-float); position: relative; }
.ma-pin::after { content: ""; position: absolute; left: 14px; bottom: -5px; width: 10px; height: 10px; background: inherit; transform: rotate(45deg); border-radius: 2px; }
.ma-pin .ma-pin-av { width: 24px; height: 24px; border-radius: var(--radius-full); background: var(--surface-2); display: grid; place-items: center; font: 700 10px/1 var(--font-display); }
.ma-pin svg { width: 13px; height: 13px; fill: var(--star); }
.ma-pin.is-active { background: var(--brand); color: var(--on-brand); }
.ma-pin.is-active .ma-pin-av { background: var(--on-brand); color: var(--brand); }
.ma-pin.is-active svg { fill: var(--on-brand); }
.ma-pin.is-busy { opacity: .62; }
.ma-me { width: 20px; height: 20px; border-radius: var(--radius-full); background: var(--trust); border: 3px solid #ffffff; box-shadow: 0 0 0 8px var(--trust-tint); }
.ma-cluster { width: 40px; height: 40px; border-radius: var(--radius-full); background: var(--action); color: var(--on-action); display: grid; place-items: center; font: 700 14px/1 var(--font-sans); box-shadow: var(--shadow-float); }

</style>
</head>
<body>
<div class="pair">
<section class="t-light"><div class="cap">Светлая</div>
<div class="ma" style="padding:20px;background:var(--bg);min-height:100%">

<div class="ma-stack" style="max-width:380px">
