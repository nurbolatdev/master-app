spring:
  application:
    name: master-app-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  mvc:
    # errors as RFC 9457 problem details
    problemdetails:
      enabled: true
  flyway:
    locations: classpath:db/migration
    # a database seeded earlier must still start without the "seed" profile
    ignore-migration-patterns: "*:future,repeatable:missing"
  docker:
    compose:
      # local infrastructure for ./mvnw spring-boot:run (skipped in tests)
      file: ../../infra/docker-compose.yml
      lifecycle-management: start-only

springdoc:
  api-docs:
    version: openapi_3_1
  # stable output: apps/api/openapi.json is compared in tests
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # local default only; every other environment sets JWT_SECRET (>= 32 characters)
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    issuer: master-app
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# "seed" adds development data (never enable it on the demo server with real users)
---
spring:
  config:
    activate:
      on-profile: seed
  flyway:
    locations: classpath:db/migration,classpath:db/seed-dev
---
# demo server: database from the environment, no docker compose
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  docker:
    compose:
      enabled: false
